<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C3 候選審核工具</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;margin:0;background:#f5efe6;color:#27231f}main{max-width:1180px;margin:auto;padding:32px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button,.file{border:1px solid #cdbda9;border-radius:999px;padding:10px 16px;background:#fffaf3;cursor:pointer}button.primary{background:#28241f;color:white}.stats{display:flex;gap:18px;flex-wrap:wrap;margin:18px 0}.stats span{background:#eadfce;padding:8px 12px;border-radius:12px}.grid{display:grid;gap:16px}.card{background:#fffaf3;border:1px solid #d7c9b8;border-radius:20px;padding:20px}.meta{display:flex;gap:10px;flex-wrap:wrap;color:#8c6549;font-size:13px}.card h2{font-size:20px;margin:12px 0}.flags{font-size:13px;color:#7d6f61}.decision{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.decision button.active{outline:3px solid #b86c43}.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.notes input{padding:10px;border:1px solid #d7c9b8;border-radius:10px}small{color:#756b61}@media(max-width:720px){.head{display:block}.notes{grid-template-columns:1fr}}</style></head><body><main><div class="head"><div><small>LOCAL REVIEW TOOL</small><h1>C3 候選審核</h1><p>此頁只在本機使用。核准不會直接發布，仍需把 decisions JSON 合併到 main，再由 C3 workflow 建立發布 PR。</p></div><button class="primary" id="export" disabled>匯出審核結果</button></div><div class="controls"><label class="file">載入 c3_candidate_queue.json<input id="file" type="file" accept="application/json" hidden></label><button id="onlyPending">只看待審</button><button id="approveEligible">核准全部可發布候選</button></div><div class="stats" id="stats"></div><div class="grid" id="grid"></div></main><script>
let queue=[],decisions=new Map(),pendingOnly=false;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setDecision(id,decision){const old=decisions.get(id)||{};decisions.set(id,{...old,candidateId:id,decision});render()}
function render(){const rows=pendingOnly?queue.filter(x=>(decisions.get(x.candidateId)?.decision||'pending')==='pending'):queue;$('#stats').innerHTML=`<span>候選 ${queue.length}</span><span>可發布 ${queue.filter(x=>x.publishEligible).length}</span><span>已核准 ${[...decisions.values()].filter(x=>x.decision==='approved').length}</span><span>擋下 ${queue.filter(x=>x.blockingIssues?.length).length}</span>`;$('#grid').innerHTML=rows.map(x=>{const d=decisions.get(x.candidateId)||{decision:'pending'};return `<article class="card"><div class="meta"><b>${esc(x.sourceName)}</b><span>${esc(x.sourceKind)}</span><span>品質 ${esc(x.qualityScore)}</span><span>${x.publishEligible?'可進發布預覽':'需人工補證'}</span></div><h2>${esc(x.title||'未命名候選')}</h2><p>${esc(x.startDate)} — ${esc(x.endDate)}｜${esc(x.venueName)}｜${esc(x.region)}</p><p class="flags">Flags：${esc((x.qualityFlags||[]).join('、')||'無')}<br>Blockers：${esc((x.blockingIssues||[]).join('、')||'無')}</p><p><a href="${esc(x.sourceUrl)}" target="_blank" rel="noopener">開啟來源 ↗</a></p><div class="decision"><button class="${d.decision==='approved'?'active':''}" onclick="setDecision('${esc(x.candidateId)}','approved')">核准</button><button class="${d.decision==='rejected'?'active':''}" onclick="setDecision('${esc(x.candidateId)}','rejected')">拒絕</button><button class="${d.decision==='hold'?'active':''}" onclick="setDecision('${esc(x.candidateId)}','hold')">待補資料</button></div><div class="notes"><input placeholder="審核備註" value="${esc(d.notes||'')}" onchange="updateField('${esc(x.candidateId)}','notes',this.value)"><input placeholder="第二證據網址（社群候選必填）" value="${esc(d.evidenceUrl||'')}" onchange="updateField('${esc(x.candidateId)}','evidenceUrl',this.value)"></div></article>`}).join('')||'<p>沒有候選資料。</p>'}
window.setDecision=setDecision;window.updateField=(id,key,value)=>{const old=decisions.get(id)||{candidateId:id,decision:'pending'};decisions.set(id,{...old,[key]:value})};
$('#file').addEventListener('change',async e=>{const data=JSON.parse(await e.target.files[0].text());queue=Array.isArray(data.candidates)?data.candidates:[];decisions=new Map(queue.map(x=>[x.candidateId,{candidateId:x.candidateId,decision:'pending',notes:'',evidenceUrl:''}]));$('#export').disabled=false;render()});
$('#onlyPending').onclick=()=>{pendingOnly=!pendingOnly;render()};$('#approveEligible').onclick=()=>{queue.filter(x=>x.publishEligible&&!x.blockingIssues?.length).forEach(x=>setDecision(x.candidateId,'approved'));render()};
$('#export').onclick=()=>{const payload={schemaVersion:1,updatedAt:new Date().toISOString(),reviewer:'',decisions:[...decisions.values()]};const blob=new Blob([JSON.stringify(payload,null,2)+'\n'],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='c3_review_decisions.json';a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
