<!doctype html><html lang="zh-Hant-TW"><meta charset="utf-8"><title>台灣展覽誌｜社群候選人工審核</title><style>body{font-family:system-ui;margin:32px;background:#f7f1e9;color:#26221e}main{max-width:980px;margin:auto}article{background:#fffaf3;border:1px solid #dbc9b6;border-radius:16px;padding:18px;margin:14px 0}button{padding:9px 14px;margin-right:8px}small{color:#826f60}.approved{border-color:#278451}.rejected{opacity:.55}</style><main><h1>社群候選人工審核</h1><p>載入 GitHub Actions 產生的 social_review_queue.json；本工具只在瀏覽器本機處理，不會自動上傳或發布。</p><input id="file" type="file" accept="application/json"><button id="export" disabled>匯出審核後 JSON</button><section id="list"></section></main><script>let payload=null;const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(){const rows=payload?.candidates||[];list.innerHTML=rows.map((x,i)=>`<article class="${esc(x.reviewStatus)}"><small>${esc(x.source)} · 信心 ${Number(x.matchConfidence||0).toFixed(2)}</small><p>${esc(x.shortExcerpt)}</p><a href="${esc(x.postUrl)}" target="_blank" rel="noopener">查看公開原文</a><p><button data-i="${i}" data-s="approved">核准</button><button data-i="${i}" data-s="rejected">拒絕</button><button data-i="${i}" data-s="pending">待確認</button></p></article>`).join('')}file.onchange=async()=>{payload=JSON.parse(await file.files[0].text());draw();export.disabled=false};list.onclick=e=>{const b=e.target.closest('button[data-i]');if(!b)return;payload.candidates[+b.dataset.i].reviewStatus=b.dataset.s;draw()};export.onclick=()=>{const blob=new Blob([JSON.stringify(payload,null,2)+'\n'],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='social_review_queue.reviewed.json';a.click();URL.revokeObjectURL(a.href)}</script></html>
