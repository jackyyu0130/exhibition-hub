<!doctype html>
<html lang="zh-Hant-TW">
<meta charset="utf-8">
<title>台灣展覽誌｜社群候選人工審核</title>
<style>
body{font-family:system-ui;margin:32px;background:#f7f1e9;color:#26221e}
main{max-width:1040px;margin:auto}
article{background:#fffaf3;border:1px solid #dbc9b6;border-radius:16px;padding:18px;margin:14px 0}
button{padding:9px 14px;margin-right:8px}
small{color:#826f60}.approved{border-color:#278451}.rejected{opacity:.55}
.badge{display:inline-block;border:1px solid #cdb69f;border-radius:999px;padding:4px 9px;margin-right:6px;font-size:12px}
.warning{color:#9a4f2f;font-weight:700}.match{padding:10px 12px;background:#f3eadf;border-radius:10px}
button[disabled]{opacity:.45;cursor:not-allowed}
</style>
<main>
<h1>社群候選人工審核</h1>
<p>載入 GitHub Actions 產生的 social_review_queue.json；本工具只在瀏覽器本機處理，不會自動上傳或發布。</p>
<input id="file" type="file" accept="application/json">
<button id="export" disabled>匯出審核後 JSON</button>
<section id="list"></section>
</main>
<script>
let payload=null;
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function canApprove(x){return Boolean(x.matchedEventId)&&Number(x.matchConfidence||0)>=.68}
function purposeLabel(value){return value==='new_event_discovery'?'新活動訊號':'展覽討論'}
function draw(){
  const rows=payload?.candidates||[];
  list.innerHTML=rows.map((x,i)=>{
    const allowed=canApprove(x);
    return `<article class="${esc(x.reviewStatus)}">
      <div><span class="badge">${esc(String(x.source||'').toUpperCase())}</span><span class="badge">${esc(purposeLabel(x.candidatePurpose))}</span>${x.verifiedAccount?'<span class="badge">已驗證帳號</span>':''}</div>
      <small>配對信心 ${Number(x.matchConfidence||0).toFixed(2)}${x.discoveryQuery?` · 搜尋詞：${esc(x.discoveryQuery)}`:''}</small>
      <p>${esc(x.shortExcerpt)}</p>
      ${x.matchedEventId?`<p class="match">配對展覽：<strong>${esc(x.matchedEventTitle||x.matchedEventId)}</strong></p>`:'<p class="warning">尚未配對站內展覽；可作為新活動發現訊號，但不能直接核准進「最近大家在聊」。</p>'}
      <a href="${esc(x.postUrl)}" target="_blank" rel="noopener">查看公開原文</a>
      <p>
        <button data-i="${i}" data-s="approved" ${allowed?'':'disabled'}>核准</button>
        <button data-i="${i}" data-s="rejected">拒絕</button>
        <button data-i="${i}" data-s="pending">待確認</button>
      </p>
    </article>`;
  }).join('')
}
file.onchange=async()=>{payload=JSON.parse(await file.files[0].text());draw();export.disabled=false};
list.onclick=e=>{const b=e.target.closest('button[data-i]');if(!b||b.disabled)return;payload.candidates[+b.dataset.i].reviewStatus=b.dataset.s;draw()};
export.onclick=()=>{const blob=new Blob([JSON.stringify(payload,null,2)+'\n'],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='social_review_queue.reviewed.json';a.click();URL.revokeObjectURL(a.href)}
</script>
</html>
