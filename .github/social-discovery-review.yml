name: Social discovery review artifact
on:
  workflow_dispatch:
  schedule:
    - cron: '40 21 * * 1,4'
permissions:
  contents: read
jobs:
  review-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - name: Build review-only candidate queue
        run: python scripts/run_social_discovery.py --output social-review-artifact/social_review_queue.json
      - name: Confirm no public feed mutation
        run: git diff --exit-code -- data/exhibitions.json data/exhibitions.enriched.json data/exhibitions.curated.json data/social_discussions.json
      - uses: actions/upload-artifact@v4
        with:
          name: social-review-${{ github.run_number }}
          path: social-review-artifact
          retention-days: 21
