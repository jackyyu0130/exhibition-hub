            --allow-planned \
            --fetch-details \
            --detail-limit "12" \
            --source-registry "data/source_registry.json" \
            --report-output "huashan-source-run.json" \
            | tee huashan-source-summary.json

      - name: Build non-published source merge candidate
        run: |
          set -o pipefail

          python scripts/build_source_merge_candidate.py \
