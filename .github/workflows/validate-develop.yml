name: Validate development changes

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run project tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sanitize checked-in images before tests
        run: |
          python scripts/audit_event_images.py \
            --fix \
            data/exhibitions.json \
            data/exhibitions.enriched.json \
            --report /tmp/pretest-image-quality-audit.json

      - name: Check Python syntax
        run: python -m compileall -q scripts tests

      - name: Check JavaScript syntax
        run: node --check assets/app.js

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

  probe-culture-ministry:
    name: Probe Culture Ministry API
    if: >-
      github.event_name == 'push' &&
      contains(
        github.event.head_commit.message,
        '[probe-culture]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe Culture Ministry exhibition feed
        run: |
          set -o pipefail

          python scripts/probe_culture_ministry.py \
            --category "6" \
            --sample-limit "5" \
            --timeout "30" \
            | tee culture-ministry-probe.json

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: culture-ministry-probe-${{ github.run_number }}
          path: culture-ministry-probe.json
          if-no-files-found: warn
          retention-days: 7

  dry-run-culture-normalization:
    name: Dry run Culture normalization
    if: >-
      github.event_name == 'push' &&
      contains(
        github.event.head_commit.message,
        '[dry-run-culture]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Culture normalization dry run
        run: |
          set -o pipefail

          python scripts/probe_culture_normalization.py \
            --category "6" \
            --sample-limit "5" \
            --timeout "30" \
            | tee culture-normalization-dry-run.json

      - name: Upload normalization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: culture-normalization-dry-run-${{ github.run_number }}
          path: culture-normalization-dry-run.json
          if-no-files-found: warn
          retention-days: 7

  dry-run-event-registry:
    name: Dry run event registry enrichment
    if: >-
      github.event_name == 'push' &&
      contains(
        github.event.head_commit.message,
        '[dry-run-registry]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate source and venue registries
        run: python scripts/validate_registries.py

      - name: Fetch latest production exhibition data
        run: |
          set -euo pipefail

          git fetch --no-tags --prune --depth=1 origin \
            +refs/heads/main:refs/remotes/origin/main

          mkdir -p build

          git show origin/main:data/exhibitions.json \
            > build/exhibitions-production.json

          python - <<'PY'
          import json
          from pathlib import Path

          source_path = Path(
              "build/exhibitions-production.json"
          )
          payload = json.loads(
              source_path.read_text(encoding="utf-8")
          )
          events = payload.get("events", [])
          stats = payload.get("stats", {})

          baseline = {
              "sourceBranch": "main",
              "updatedAt": payload.get("updatedAt"),
              "eventCount": len(events),
              "stats": stats,
          }

          Path(
              "production-data-baseline.json"
          ).write_text(
              json.dumps(
                  baseline,
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )

          print(
              json.dumps(
                  baseline,
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      - name: Run event registry dry run
        run: |
          set -o pipefail

          python scripts/apply_event_registry.py \
            --input "build/exhibitions-production.json" \
            --venues "data/venues.json" \
            --legacy-aliases "data/venue-aliases.json" \
            --report-output "event-registry-dry-run.json" \
            --sample-limit "150" \
            | tee event-registry-dry-run-summary.json

      - name: Upload event registry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-registry-dry-run-${{ github.run_number }}
          path: |
            production-data-baseline.json
            event-registry-dry-run.json
            event-registry-dry-run-summary.json
          if-no-files-found: warn
          retention-days: 7

  build-enriched-candidate:
    name: Build enriched candidate data
    if: >-
      github.event_name == 'push' &&
      contains(
        github.event.head_commit.message,
        '[build-enriched]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate source and venue registries
        run: python scripts/validate_registries.py

      - name: Fetch latest production exhibition data
        run: |
          set -euo pipefail

          git fetch --no-tags --prune --depth=1 origin \
            +refs/heads/main:refs/remotes/origin/main

          mkdir -p build

          git show origin/main:data/exhibitions.json \
            > build/exhibitions-production.json

          python - <<'PY'
          import json
          from pathlib import Path

          source_path = Path(
              "build/exhibitions-production.json"
          )
          payload = json.loads(
              source_path.read_text(encoding="utf-8")
          )
          events = payload.get("events", [])
          stats = payload.get("stats", {})

          baseline = {
              "sourceBranch": "main",
              "updatedAt": payload.get("updatedAt"),
              "eventCount": len(events),
              "stats": stats,
          }

          Path(
              "production-data-baseline.json"
          ).write_text(
              json.dumps(
                  baseline,
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )

          print(
              json.dumps(
                  baseline,
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      - name: Build enriched candidate data
        run: |
          set -o pipefail

          python scripts/build_enriched_candidate.py \
            --input "build/exhibitions-production.json" \
            --venues "data/venues.json" \
            --legacy-aliases "data/venue-aliases.json" \
            --output "exhibitions.enriched.candidate.json" \
            --report-output "enriched-candidate-report.json" \
            --excluded-output "excluded-events-review.json" \
            | tee enriched-candidate-summary.json

      - name: Upload enriched candidate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enriched-candidate-${{ github.run_number }}
          path: |
            production-data-baseline.json
            exhibitions.enriched.candidate.json
            enriched-candidate-report.json
            excluded-events-review.json
            enriched-candidate-summary.json
          if-no-files-found: warn
          retention-days: 7

  dry-run-collector-framework:
    name: Dry run collector framework
    if: >-
      github.event_name == 'push' &&
      contains(
        github.event.head_commit.message,
        '[dry-run-collectors]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Audit collector framework
        run: |
          set -o pipefail

          python scripts/run_collectors.py \
            --audit-only \
            --source-registry "data/source_registry.json" \
            --report-output "collector-framework-audit.json" \
            | tee collector-framework-summary.json

      - name: Upload collector framework audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collector-framework-audit-${{ github.run_number }}
          path: |
            collector-framework-audit.json
            collector-framework-summary.json
          if-no-files-found: warn
          retention-days: 7

  dry-run-huashan:
    name: Dry run Huashan collector
    if: >-
      github.event_name == 'push' &&
      contains(
        github.event.head_commit.message,
        '[dry-run-huashan]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Huashan collector dry run
        run: |
          set -o pipefail

          python scripts/run_collectors.py \
            --source "huashan-1914" \
            --allow-planned \
            --source-registry "data/source_registry.json" \
            --report-output "huashan-collector-dry-run.json" \
            | tee huashan-collector-summary.json

      - name: Upload Huashan collector report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huashan-collector-dry-run-${{ github.run_number }}
          path: |
            huashan-collector-dry-run.json
            huashan-collector-summary.json
          if-no-files-found: warn
          retention-days: 7

  dry-run-huashan-details:
    name: Dry run Huashan detail normalization
    if: >-
      github.event_name == 'push' &&
      contains(
        github.event.head_commit.message,
        '[dry-run-huashan-details]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Huashan detail normalization dry run
        run: |
          set -o pipefail

          python scripts/run_collectors.py \
            --source "huashan-1914" \
            --allow-planned \
            --fetch-details \
            --detail-limit "8" \
            --source-registry "data/source_registry.json" \
            --report-output "huashan-detail-dry-run.json" \
            | tee huashan-detail-summary.json

      - name: Upload Huashan detail report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huashan-detail-dry-run-${{ github.run_number }}
          path: |
            huashan-detail-dry-run.json
            huashan-detail-summary.json
          if-no-files-found: warn
          retention-days: 7


  dry-run-source-merge:
    name: Dry run official source merge
    if: >-
      github.event_name == 'push' &&
      contains(
        github.event.head_commit.message,
        '[dry-run-source-merge]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate registries
        run: python scripts/validate_registries.py

      - name: Run Huashan collector with detail sample
        run: |
          set -o pipefail

          python scripts/run_collectors.py \
            --source "huashan-1914" \
            --allow-planned \
            --fetch-details \
            --detail-limit "12" \
            --source-registry "data/source_registry.json" \
            --report-output "huashan-source-run.json" \
            | tee huashan-source-summary.json

      - name: Build non-published source merge candidate
        run: |
          set -o pipefail

          python scripts/build_source_merge_candidate.py \
            --base "data/exhibitions.enriched.json" \
            --source-run "huashan-source-run.json" \
            --source-registry "data/source_registry.json" \
            --source-id "huashan-1914" \
            --candidate-output "huashan-merge-candidate.json" \
            --report-output "huashan-merge-report.json" \
            --review-output "huashan-merge-review.json" \
            | tee huashan-merge-summary.json

      - name: Upload source merge candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huashan-source-merge-${{ github.run_number }}
          path: |
            huashan-source-run.json
            huashan-source-summary.json
            huashan-merge-candidate.json
            huashan-merge-report.json
            huashan-merge-review.json
            huashan-merge-summary.json
          if-no-files-found: warn
          retention-days: 7


  validate-huashan-full-candidate:
    name: Validate full Huashan candidate
    if: >-
      github.event_name == 'push' &&
      contains(
        github.event.head_commit.message,
        '[full-candidate-huashan]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate registries
        run: python scripts/validate_registries.py

      - name: Fetch every current Huashan detail page
        run: |
          set -o pipefail

          python scripts/run_collectors.py \
            --source "huashan-1914" \
            --allow-planned \
            --fetch-details \
            --source-registry "data/source_registry.json" \
            --report-output "huashan-full-source-run.json" \
            | tee huashan-full-source-summary.json

      - name: Build full non-published candidate
        run: |
          set -o pipefail

          python scripts/build_source_merge_candidate.py \
            --base "data/exhibitions.enriched.json" \
            --source-run "huashan-full-source-run.json" \
            --source-registry "data/source_registry.json" \
            --source-id "huashan-1914" \
            --candidate-output "huashan-full-candidate.json" \
            --report-output "huashan-full-merge-report.json" \
            --review-output "huashan-full-review.json" \
            | tee huashan-full-merge-summary.json

      - name: Validate full candidate quality gates
        run: |
          set -o pipefail

          python scripts/validate_source_merge_candidate.py \
            --base "data/exhibitions.enriched.json" \
            --source-run "huashan-full-source-run.json" \
            --candidate "huashan-full-candidate.json" \
            --merge-report "huashan-full-merge-report.json" \
            --review "huashan-full-review.json" \
            --source-id "huashan-1914" \
            --require-full-details \
            --max-review "0" \
            --output "huashan-full-quality-report.json" \
            | tee huashan-full-quality-summary.json

      - name: Upload full candidate audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huashan-full-candidate-${{ github.run_number }}
          path: |
            huashan-full-source-run.json
            huashan-full-source-summary.json
            huashan-full-candidate.json
            huashan-full-merge-report.json
            huashan-full-review.json
            huashan-full-merge-summary.json
            huashan-full-quality-report.json
            huashan-full-quality-summary.json
          if-no-files-found: warn
          retention-days: 7


  preview-huashan-production-publish:
    name: Preview Huashan production publish
    if: >-
      github.event_name == 'push' &&
      contains(
        github.event.head_commit.message,
        '[preview-publish-huashan]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate registries
        run: python scripts/validate_registries.py

      - name: Build fresh enriched base from latest raw data
        run: |
          set -o pipefail

          python scripts/build_enriched_candidate.py \
            --input "data/exhibitions.json" \
            --venues "data/venues.json" \
            --legacy-aliases "data/venue-aliases.json" \
            --output "huashan-publish-fresh-base.json" \
            --report-output "huashan-publish-fresh-base-report.json" \
            --excluded-output "huashan-publish-fresh-base-excluded.json" \
            | tee huashan-publish-fresh-base-summary.json

      - name: Fetch every current Huashan detail page
        run: |
          set -o pipefail

          python scripts/run_collectors.py \
            --source "huashan-1914" \
            --allow-planned \
            --fetch-details \
            --source-registry "data/source_registry.json" \
            --report-output "huashan-publish-source-run.json" \
            | tee huashan-publish-source-summary.json

      - name: Build Huashan merge candidate from fresh base
        run: |
          set -o pipefail

          python scripts/build_source_merge_candidate.py \
            --base "huashan-publish-fresh-base.json" \
            --source-run "huashan-publish-source-run.json" \
            --source-registry "data/source_registry.json" \
            --source-id "huashan-1914" \
            --candidate-output "huashan-publish-merge-candidate.json" \
            --report-output "huashan-publish-merge-report.json" \
            --review-output "huashan-publish-review.json" \
            | tee huashan-publish-merge-summary.json

      - name: Validate full candidate before preview
        run: |
          set -o pipefail

          python scripts/validate_source_merge_candidate.py \
            --base "huashan-publish-fresh-base.json" \
            --source-run "huashan-publish-source-run.json" \
            --candidate "huashan-publish-merge-candidate.json" \
            --merge-report "huashan-publish-merge-report.json" \
            --review "huashan-publish-review.json" \
            --source-id "huashan-1914" \
            --require-full-details \
            --max-review "0" \
            --output "huashan-publish-quality-report.json" \
            | tee huashan-publish-quality-summary.json

      - name: Prepare non-published production preview
        run: |
          set -o pipefail

          python scripts/prepare_source_publish_preview.py \
            --base "huashan-publish-fresh-base.json" \
            --source-run "huashan-publish-source-run.json" \
            --candidate "huashan-publish-merge-candidate.json" \
            --merge-report "huashan-publish-merge-report.json" \
            --review "huashan-publish-review.json" \
            --quality-report "huashan-publish-quality-report.json" \
            --source-id "huashan-1914" \
            --preview-output "huashan-publish-preview.json" \
            --diff-output "huashan-publish-diff.json" \
            --excluded-output "huashan-publish-excluded.json" \
            | tee huashan-publish-preview-summary.json

      - name: Upload Huashan production preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huashan-publish-preview-${{ github.run_number }}
          path: |
            huashan-publish-fresh-base.json
            huashan-publish-fresh-base-report.json
            huashan-publish-fresh-base-excluded.json
            huashan-publish-fresh-base-summary.json
            huashan-publish-source-run.json
            huashan-publish-source-summary.json
            huashan-publish-merge-candidate.json
            huashan-publish-merge-report.json
            huashan-publish-review.json
            huashan-publish-merge-summary.json
            huashan-publish-quality-report.json
            huashan-publish-quality-summary.json
            huashan-publish-preview.json
            huashan-publish-diff.json
            huashan-publish-excluded.json
            huashan-publish-preview-summary.json
          if-no-files-found: warn
          retention-days: 7


  dry-run-source-batch:
    name: Dry run resilient official source batch
    if: >-
      github.event_name == 'push' &&
      contains(
        github.event.head_commit.message,
        '[dry-run-source-batch]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate registries
        run: python scripts/validate_registries.py

      - name: Run resilient active official venue batch
        run: |
          set -o pipefail

          python scripts/run_collector_batch.py \
            --batch "active-official-venues" \
            --source-batches "data/source_batches.json" \
            --source-registry "data/source_registry.json" \
            --fetch-details \
            --max-attempts "3" \
            --retry-backoff-seconds "2" \
            --source-timeout-seconds "180" \
            --slow-source-threshold-ms "90000" \
            --output-dir "official-source-batch" \
            --report-output "official-source-batch-report.json" \
            --health-output "official-source-batch-health.json" \
            | tee official-source-batch-summary.json

      - name: Validate live source batch health
        run: |
          set -o pipefail

          python scripts/validate_source_batch_health.py \
            --input "official-source-batch-health.json" \
            --max-failed-sources "0" \
            --max-timeouts "0" \
            --require-records \
            --output "official-source-batch-health-validation.json" \
            | tee official-source-batch-health-validation-summary.json

      - name: Simulate retry, timeout, and source isolation
        run: |
          set -o pipefail

          python scripts/simulate_source_batch_resilience.py \
            --output "source-batch-resilience-simulation.json" \
            | tee source-batch-resilience-simulation-summary.json

      - name: Upload resilient source batch audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resilient-source-batch-${{ github.run_number }}
          path: |
            official-source-batch/
            official-source-batch-report.json
            official-source-batch-summary.json
            official-source-batch-health.json
            official-source-batch-health-validation.json
            official-source-batch-health-validation-summary.json
            source-batch-resilience-simulation.json
            source-batch-resilience-simulation-summary.json
          if-no-files-found: warn
          retention-days: 7


  dry-run-songshan-candidate:
    name: Dry run Songshan northern venue candidate
    if: >-
      github.event_name == 'push' &&
      contains(
        github.event.head_commit.message,
        '[dry-run-songshan]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate registries
        run: python scripts/validate_registries.py

      - name: Run resilient northern cultural park batch
        run: |
          set -o pipefail

          python scripts/run_collector_batch.py \
            --batch "cultural-parks-north" \
            --source-batches "data/source_batches.json" \
            --source-registry "data/source_registry.json" \
            --allow-disabled-batch \
            --allow-planned \
            --fetch-details \
            --max-attempts "3" \
            --retry-backoff-seconds "2" \
            --source-timeout-seconds "240" \
            --slow-source-threshold-ms "120000" \
            --output-dir "north-cultural-parks-batch" \
            --report-output "north-cultural-parks-batch-report.json" \
            --health-output "north-cultural-parks-batch-health.json" \
            | tee north-cultural-parks-batch-summary.json

      - name: Validate northern batch health
        run: |
          set -o pipefail

          python scripts/validate_source_batch_health.py \
            --input "north-cultural-parks-batch-health.json" \
            --max-failed-sources "0" \
            --max-timeouts "0" \
            --require-records \
            --output "north-cultural-parks-health-validation.json" \
            | tee north-cultural-parks-health-validation-summary.json

      - name: Extract Songshan source report
        run: |
          cp \
            "north-cultural-parks-batch/sources/songshan-cultural-park.json" \
            "songshan-source-run.json"

      - name: Validate Songshan source fields
        run: |
          set -o pipefail

          python scripts/validate_songshan_source.py \
            --input "songshan-source-run.json" \
            --output "songshan-source-quality.json" \
            | tee songshan-source-quality-summary.json

      - name: Build Songshan merge candidate
        run: |
          set -o pipefail

          python scripts/build_source_merge_candidate.py \
            --base "data/exhibitions.enriched.json" \
            --source-run "songshan-source-run.json" \
            --source-registry "data/source_registry.json" \
            --source-id "songshan-cultural-park" \
            --candidate-output "songshan-merge-candidate.json" \
            --report-output "songshan-merge-report.json" \
            --review-output "songshan-merge-review.json" \
            | tee songshan-merge-summary.json

      - name: Validate Songshan merge candidate
        run: |
          set -o pipefail

          python scripts/validate_source_merge_candidate.py \
            --base "data/exhibitions.enriched.json" \
            --source-run "songshan-source-run.json" \
            --candidate "songshan-merge-candidate.json" \
            --merge-report "songshan-merge-report.json" \
            --review "songshan-merge-review.json" \
            --source-id "songshan-cultural-park" \
            --require-full-details \
            --max-review "100" \
            --output "songshan-merge-quality.json" \
            | tee songshan-merge-quality-summary.json

      - name: Upload Songshan northern venue audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: songshan-north-candidate-${{ github.run_number }}
          path: |
            north-cultural-parks-batch/
            north-cultural-parks-batch-report.json
            north-cultural-parks-batch-summary.json
            north-cultural-parks-batch-health.json
            north-cultural-parks-health-validation.json
            north-cultural-parks-health-validation-summary.json
            songshan-source-run.json
            songshan-source-quality.json
            songshan-source-quality-summary.json
            songshan-merge-candidate.json
            songshan-merge-report.json
            songshan-merge-review.json
            songshan-merge-summary.json
            songshan-merge-quality.json
            songshan-merge-quality-summary.json
          if-no-files-found: warn
          retention-days: 7
