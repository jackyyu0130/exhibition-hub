scripts/exhibition_hub/collectors/base.py
scripts/exhibition_hub/collectors/http.py
新版檔案改成另一套名稱：

CollectorSource
CollectorRecord
CollectorRunReport
CollectorHttpClient
結果造成原有的文化部 Collector、HTTP Client 與測試無法匯入舊介面。這也是為什麼本次不是單一測試失敗，而是 6 個測試模組在載入階段就中斷。

