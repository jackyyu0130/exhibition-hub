name: Weekly exhibition update (low resource)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RUN_WEEKLY_UPDATE to start one controlled update
        required: true
        type: string
  schedule:
    # Sunday 03:17 in Taiwan. A non-round minute avoids the busiest cron window.
    - cron: "17 19 * * 6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: exhibition-hub-weekly-update
  cancel-in-progress: true

jobs:
  update-and-deploy:
    if: >-
      (github.event_name == 'schedule' && vars.WEEKLY_UPDATE_ENABLED != 'false') ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'RUN_WEEKLY_UPDATE')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Culture Ministry feed: two request workers and one attempt only.
      CULTURE_API_TIMEOUT: "20"
      CULTURE_API_RETRIES: "1"
      CULTURE_API_WORKERS: "2"
      # Incremental detail/image work is capped instead of re-fetching 2,200 rows.
      MAX_DETAIL_FETCHES: "80"
      MAX_IMAGE_FETCHES: "80"
      MAX_GEOCODES: "15"
      SCRAPER_DETAIL_WORKERS: "2"
      SCRAPER_IMAGE_WORKERS: "2"
      # Official venue sources run sequentially and inspect at most 20 details each.
      # Huashan stays complete because its production quality gate requires it.
      EXHIBITION_HUB_DETAIL_LIMIT: "20"
      EXHIBITION_HUB_DETAIL_RETRY_ROUNDS: "0"

    steps:
      - name: Checkout main once
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the single runtime dependency set
        run: pip install -r requirements.txt

      - name: Run bounded weekly crawler and safety gates
        run: python scripts/run_local_weekly_update.py

      - name: Add Chinese run summary
        if: always()
        shell: bash
        run: |
          if [ -f local-update-output/latest-summary.md ]; then
            cat local-update-output/latest-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 每週展覽更新未完成" >> "$GITHUB_STEP_SUMMARY"
            echo "請查看失敗步驟；正式資料已由更新程式自動還原。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit only prepared production data
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          TRACKED_PATHS=(
            data/exhibitions.json
            data/exhibitions.enriched.json
            data/exhibitions.curated.json
            data/social_discussions.json
            data/geocode-cache.json
            data/update-reports/latest-local-weekly-update.json
            data/update-reports/official-source-batch.json
            data/update-reports/image-quality-audit.json
            data/update-reports/curated-feed-report.json
          )

          git add -- "${TRACKED_PATHS[@]}"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No production data changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: weekly exhibition update"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build validated static website
        run: python scripts/build_pages_site.py --root . --output site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload prepared website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Keep failure diagnostics briefly
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-update-failure-${{ github.run_number }}
          path: local-update-output
          if-no-files-found: warn
          retention-days: 3
